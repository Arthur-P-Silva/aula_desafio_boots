<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Aula Bootstrap</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!--fixed-top: Fixa cabeçalho no topo; shadow-sm: Sombra clara; px-3: espaçamento 3-->
    <header id="app-header" class="navbar navbar-dark bg-success fixed-top shadow-sm px-3">
        <!--mb: Margin Bottom; h5: Tamanho do texto; d-flex: Display Flex -->
        <span class="navbar-brand mb-0 h5 d-flex align-items-center">
            <strong>Aula Bootstrap</strong> <!-- Texto forte (negrito) -->
        </span>
        <!--rounded-cicrcle: Arredonda para ficar uma bola-->
        <div class="photo_profile d-flex align-items-center justify-content-center bg-white">
            <img src="./img/petrobras.png" alt="Logo" class="img-fluid">
        </div>
    </header>

    <main class="container-fluid">
        <div class="row">
            <!-- total de colunas 12, em telas médias 3 colunas pro aside, em telas grandes coluna 2-->
             <!-- l-0: Left 0 -->
            <aside class="col-12 col-md-3 col-lg-2 sidebar text-white bg-warning p-3 mt-5 l-0">
                <nav class="nav flex-md-column flex-row nav-pills gap-2">
                    <a id="home" class="nav-link text-white bg-transparent">Home</a>
                    <a href="#products" class="nav-link text-white bg-transparent">Produtos</a>
                    <a href="#orders" class="nav-link text-white bg-transparent">Ordem</a>
                    <a href="#about" class="nav-link text-white bg-transparent">Sobre</a>
                </nav>
            </aside>

            <!-- pt: Padding Top; pb: Padding bottom -->
            <!-- Total de colunas 12, em telas médias 9 pra section e em telas grandes 10-->
            <section class="col-12 col-md-9 col-lg-10 pt-3 pb-5 mt-5">
                <section class="card shadow-sm position-relative mb-4">
                    <div class="card-body">
                        <iframe 
                            id="pages" 
                            src="" 
                            frameborder="0" 
                            class="w-100 h-100 border rounded">
                        </iframe>
                    </div>
                </section>
            </section>
        </div>
    </main>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/index.js"></script>
</body>
</html>
